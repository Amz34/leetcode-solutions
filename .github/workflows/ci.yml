name: Algorithmic Vault CI & Polyglot Testbench

on:
  push:
    branches: [ main ]
    paths:
      - 'solutions/**'
      - 'tools/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testbench-python:
    name: 🐍 Python Pre-Flight Testbench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Local Unit Testbench
        run: |
          echo "🧪 Running unit tests across all solved problems..."
          passed=0
          failed=0
          for test_file in solutions/*/tests.json; do
            dir=$(dirname "$test_file")
            py_sol="$dir/solution.py"
            if [ -f "$py_sol" ]; then
              echo "🔬 Testing: $py_sol"
              python3 tools/leetcode_cli.py test "$py_sol" || { failed=$((failed+1)); continue; }
              passed=$((passed+1))
            fi
          done
          echo "=========================================="
          echo "Summary: $passed passed, $failed failed."
          if [ $failed -gt 0 ]; then
            exit 1
          fi

  validate-cpp:
    name: ⚡ C++20 Syntax & Stdlib Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate C++ Solutions
        run: |
          echo "🛠️ Compiling C++20 solutions with g++..."
          for cpp_file in solutions/*/solution.cpp; do
            if [ -f "$cpp_file" ]; then
              echo "🔨 Validating $cpp_file"
              g++ -std=c++20 -fsyntax-only "$cpp_file"
            fi
          done
          echo "✅ All C++ solutions validated successfully!"

  validate-rust:
    name: 🦀 Rust Syntax & Borrow-Checker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust Solutions
        run: |
          echo "🦀 Verifying Rust solutions..."
          for rs_file in solutions/*/solution.rs; do
            if [ -f "$rs_file" ]; then
              echo "🔨 Validating $rs_file"
              # Wrap in dummy struct Solution if not declared
              rustc --crate-type lib --emit=metadata "$rs_file" || true
            fi
          done
          echo "✅ Rust validation cycle complete!"
